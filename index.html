<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kira стиль — світ тканини та фурнітури</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 10px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      color: #7f8c8d;
      margin-top: 8px;
      font-size: 1.1rem;
    }

    /* Сітка товарів */
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
    }

    .card-img-container {
      width: 100%;
      height: 200px;
      overflow: hidden;
      background-color: #eee;
      cursor: zoom-in; /* Показує курсор збільшення */
      position: relative;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card-img-container:hover img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: capitalize;
      color: #333;
      line-height: 1.3;
    }

    .card-category {
      font-size: 0.8rem;
      color: #888;
      background: #f0f0f0;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #e74c3c;
      margin-top: 5px;
    }

    /* Модальне вікно для збільшення зображення */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 20px;
    }

    .modal img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Kira стиль</h1>
    <p>Світ тканини та фурнітури</p>
  </header>

  <main>
    <div id="catalog" class="catalog"></div>
  </main>

  <!-- Модальне вікно для перегляду фото -->
  <div id="imageModal" class="modal">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Збільшене фото">
  </div>

  <script>
    // Завантаження даних із вашого JSON-файлу
    // Переконайся, що JSON-файл лежить поряд і називається data.json (або зміни назву тут)
    fetch('data.json')
      .then(response => response.json())
      .then(products => {
        renderCatalog(products);
      })
      .catch(error => {
        console.error('Помилка завантаження товарів:', error);
      });

    function renderCatalog(products) {
      const catalogContainer = document.getElementById('catalog');
      catalogContainer.innerHTML = '';

      products.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-img-container" onclick="openModal('${item.image}', '${item.title}')">
            <img src="${item.image}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-body">
            <span class="card-category">${item.subcategory || item.category}</span>
            <div class="card-title">${item.title}</div>
            <div class="card-price">${item.price} грн / ${item.unit}</div>
          </div>
        `;

        catalogContainer.appendChild(card);
      });
    }

    // Логіка збільшення зображення
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');

    function openModal(imageSrc, title) {
      modal.style.display = 'flex';
      modalImg.src = imageSrc;
      modalImg.alt = title;
    }
// Закриття при кліку в будь-яке місце вікна
        modal.addEventListener('click', () => {
          modal.style.display = 'none';
        });
        // Цей шматок обов'язково має бути ВСЕРЕДИНІ тегу script:
        fetch('products.json')
          .then(response => response.json())
          .then(products => {
            renderCatalog(products);
          })
          .catch(error => {
            console.error('Помилка завантаження товарів:', error);
          });
      </script>
    </body>
  </html>
