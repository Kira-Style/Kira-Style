<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kira стиль — світ тканини та фурнітури</title>
  
  <!-- Підключення шрифтів -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* === ОСНОВНІ НАЛАШТУВАННЯ === */
    :root {
      --primary: #0088cc;
      --primary-dark: #0077b3;
      --sale-color: #e74c3c;
      --new-color: #2ecc71;
      --hit-color: #f1c40f;
      --bg-main: #8a9296; /* Ваш колір фону */
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --radius: 14px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-color);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* === АНІМАЦІЇ === */
    @keyframes cartBump {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .cart-anim {
      animation: cartBump 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === ШАПКА САЙТУ === */
    header {
      background: #ffffff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,0.15);
    }

    .logo-container h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .btn-cart {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3);
    }

    .btn-cart:active {
      transform: scale(0.95);
    }

    /* === КОНТЕЙНЕР ТА ПОШУК === */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
      min-height: 85vh;
    }

    .search-section {
      margin-bottom: 20px;
    }

    #search-input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: #ffffff;
      font-size: 16px;
      outline: none;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    #search-input:focus {
      border-color: var(--primary);
    }

    /* === ПОВІДОМЛЕННЯ ПРО ПОРОЖНІЙ ПОШУК === */
    #search-empty {
      display: none;
      text-align: center;
      background: #ffffff;
      padding: 40px 20px;
      border-radius: var(--radius);
      margin: 20px 0;
      box-shadow: var(--shadow);
      animation: fadeIn 0.4s ease;
    }

    #search-empty h3 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      color: #555;
    }

    #search-empty p {
      margin: 0;
      color: #888;
    }

    /* === КАТЕГОРІЇ (СКРОЛ ДЛЯ ТЕЛЕФОНУ) === */
    .filter-wrapper {
      margin-bottom: 15px;
    }

    .categories-scroll, .subcategories-scroll {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 5px 2px 12px 2px;
      scrollbar-width: none; /* Firefox */
    }

    .categories-scroll::-webkit-scrollbar, 
    .subcategories-scroll::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .cat-btn, .subcat-btn {
      white-space: nowrap;
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      background: #ffffff;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: var(--transition);
    }

    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.4);
    }

    .subcat-btn.active {
      background: #333333;
      color: #ffffff;
    }

    /* === СІТКА ТОВАРІВ === */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 колонки на мобілках */
      gap: 12px;
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 25px;
      }
    }

    /* === КАРТКА ТОВАРУ === */
    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: var(--transition);
      animation: fadeIn 0.5s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Баджі (стікери) */
    .badge {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      z-index: 10;
      letter-spacing: 0.5px;
    }
    .badge-sale { background: var(--sale-color); }
    .badge-new { background: var(--new-color); }
    .badge-hit { background: var(--hit-color); color: #000; }

    .product-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #f8f9fa;
      cursor: zoom-in;
    }

    .product-card h3 {
      font-size: 0.95rem;
      margin: 0 0 10px 0;
      height: 2.8em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-weight: 600;
      color: #333;
    }

    .product-price-info {
      margin-bottom: 12px;
    }

    .old-price {
      display: block;
      text-decoration: line-through;
      color: #a0a0a0;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    .current-price {
      display: block;
      color: var(--primary);
      font-weight: 700;
      font-size: 1.15rem;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #666;
    }

    .qty-input {
      width: 55px;
      padding: 6px;
      border: 1.5px solid #eee;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      outline: none;
    }

    /* КНОПКА ДОДАТИ / В КОШИКУ */
    .add-to-cart-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      margin-top: auto;
    }

    .add-to-cart-btn:hover {
      background: var(--primary-dark);
    }

    .add-to-cart-btn.already-in-cart {
      background: #f0fdf4;
      color: #16a34a;
      border: 1.5px solid #16a34a;
    }

    /* === МОДАЛЬНІ ВІКНА === */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 15px;
      backdrop-filter: blur(8px);
    }

    .cart-modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 25px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
    }

    .cart-title {
      font-size: 1.5rem;
      margin: 0 0 20px 0;
      font-weight: 800;
    }

    #cart-items-list {
      margin-bottom: 20px;
      border-top: 1px solid #eee;
    }

    .total-price-block {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1.5px solid #eee;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .checkout-btn {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    /* Кнопка вгору */
    #scroll-to-top {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #ffffff;
      color: var(--primary);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: none;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 900;
      font-size: 24px;
      font-weight: bold;
    }

    /* Мобільні виправлення */
    @media (max-width: 600px) {
      .logo-container h1 { font-size: 1.1rem; }
      .btn-cart { padding: 8px 14px; font-size: 13px; }
      .product-card { padding: 10px; }
      .product-card h3 { font-size: 0.85rem; }
      .current-price { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <header>
    <div class="logo-container">
      <h1>Kira стиль</h1>
    </div>
    <button id="main-cart-btn" class="btn-cart" onclick="toggleCart()">
      <span>🛒</span> Кошик (<span id="cart-count">0</span>)
    </button>
  </header>

  <div class="main-container">
    
    <!-- ПОШУК -->
    <div class="search-section">
      <input type="text" id="search-input" placeholder="Пошук тканини чи фурнітури...">
    </div>

    <!-- ФІЛЬТРИ -->
    <div class="filter-wrapper">
      <div class="categories-scroll" id="categories-container"></div>
      <div class="subcategories-scroll" id="subcategories-container"></div>
    </div>

    <!-- ПОВІДОМЛЕННЯ ПРО ПОРОЖНІЙ ПОШУК -->
    <div id="search-empty">
      <h3>🔍 Товарів не знайдено</h3>
      <p>У цій категорії товарів з такою назвою немає. Спробуйте змінити запит.</p>
    </div>

    <!-- СІТКА ТОВАРІВ -->
    <div id="products-grid" class="products-grid">
      <!-- Сюди скрипт вставить картки -->
    </div>

  </div>

  <!-- КНОПКА ВГОРУ -->
  <div id="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</div>

  <!-- МОДАЛКА КОШИКА -->
  <div class="modal-overlay" id="cart-modal">
    <div class="cart-modal-content">
      <h2 class="cart-title">Ваше замовлення</h2>
      
      <div id="cart-items-list">
        <!-- Список товарів у кошику -->
      </div>

      <div class="total-price-block">
        <span>Разом до сплати:</span>
        <span><span id="cart-total">0</span> грн</span>
      </div>

      <input type="text" id="cust-name" class="input-field" placeholder="Ваше ім'я" required>
      <input type="tel" id="cust-phone" class="input-field" placeholder="Ваш номер телефону" required>

      <button class="checkout-btn" onclick="validateAndSendOrder()">Оформити замовлення</button>
      <button class="checkout-btn" onclick="toggleCart()" style="background: #f5f5f5; color: #333; margin-top: 10px;">Продовжити покупки</button>
    </div>
  </div>

  <!-- МОДАЛКА ДЛЯ ЗБІЛЬШЕННЯ ФОТО -->
  <div class="modal-overlay" id="img-zoom-modal" onclick="this.style.display='none'">
    <img id="zoomed-image" src="" style="max-width: 100%; max-height: 90vh; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
  </div>

  <!-- ЛОГІКА САЙТУ -->
  <script>
    // 1. Анімація кошика при додаванні
    function animateCartButton() {
      const btn = document.getElementById('main-cart-btn');
      btn.classList.remove('cart-anim');
      void btn.offsetWidth; // Тригер перемальовки для перезапуску анімації
      btn.classList.add('cart-anim');
    }

    // 2. Збільшення фото
    document.getElementById('products-grid').addEventListener('click', function(e) {
      if (e.target.tagName === 'IMG') {
        const modal = document.getElementById('img-zoom-modal');
        const zoomedImg = document.getElementById('zoomed-image');
        zoomedImg.src = e.target.src;
        modal.style.display = 'flex';
      }
    });

    // 3. Пошук в реальному часі (викликається в script.js)
    document.getElementById('search-input').addEventListener('input', function() {
      if (typeof renderProducts === 'function') {
        renderProducts();
      }
    });

    // 4. Кнопка вгору
    window.onscroll = function() {
      const btn = document.getElementById('scroll-to-top');
      if (window.scrollY > 400) {
        btn.style.display = 'flex';
      } else {
        btn.style.display = 'none';
      }
    };

    // 5. Валідація замовлення
    function validateAndSendOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim().replace(/\D/g, '');

      if (name.length < 2) {
        alert("Будь ласка, введіть ваше ім'я.");
        return;
      }
      if (phone.length < 10) {
        alert("Будь ласка, введіть коректний номер телефону (мінімум 10 цифр).");
        return;
      }

      // Виклик функції відправки з вашого script.js
      if (typeof sendOrder === 'function') {
        sendOrder();
      }
    }
  </script>

  <!-- ПІДКЛЮЧЕННЯ ВАШОГО СКРИПТА -->
  <script src="script.js"></script>

</body>
</html>
